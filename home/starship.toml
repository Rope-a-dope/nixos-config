add_newline = false
command_timeout = 1000
scan_timeout = 10

palette = "catppuccin_mocha"

# Two-line lean prompt with a left frame.
format = "$os $directory $git_branch$git_status$line_break$character"
right_format = "$cmd_duration $time"

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
NixOS = ""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false
home_symbol = "  ~"


[git_branch]
symbol = "  "
style = "lavender"
format = "[$symbol](subtext0)[$branch]($style) "


[git_status]
style = "subtext0"
format = '([$all_status$ahead_behind]($style))'

conflicted = "[=${count}](red bold) "
ahead = "[⇡${count}](sky) "
behind = "[⇣${count}](peach) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](mauve) "
untracked = "[?${count}](red) "
stashed = "[≡${count}](overlay2) "
modified = "[!${count}](yellow) "
staged = "[+${count}](green) "
renamed = "[»${count}](blue) "
deleted = "[✘${count}](red) "

[elixir]
symbol = " "
style = "mauve"
format = "[ · $symbol$version]($style)"

[erlang]
symbol = " "
style = "peach"
format = "[ · $symbol$version]($style)"

[rust]
symbol = " "
style = "peach"
format = "[ · $symbol$version]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[ · $symbol$version]($style)"

[nix_shell]
symbol = " "
style = "sky"
format = "[ · $symbol$name]($style)"
heuristic = true

[time]
disabled = false
time_format = "%H:%M"
style = "green"
format = "[ $time]($style)"

[cmd_duration]
min_time = 2000
style = "green"
format = "[  $duration]($style)"

