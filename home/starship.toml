add_newline = false
command_timeout = 1000

# Minimal left prompt; contextual information on the right.
format = "$directory$character"
right_format = "$git_branch$git_status$elixir$erlang$rust$nodejs$nix_shell$cmd_duration"

palette = "catppuccin_mocha"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lavender)"

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "green"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "

[elixir]
symbol = " "
style = "mauve"
format = "[$symbol$version]($style) "

[erlang]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[nix_shell]
symbol = "❄ "
style = "sky"
format = "[$symbol$name]($style) "
heuristic = true

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[took $duration]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
