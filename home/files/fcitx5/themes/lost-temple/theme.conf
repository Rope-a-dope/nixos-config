# vim: ft=dosini
[Metadata]
Name=Lost Temple
Version=1.0
Author=justTOBBI, Isabelinc, Kurome
Description=Lost Temple dark theme with Catppuccin Mocha Green accents
ScaleWithDPI=True

[InputPanel]
Font=Sans 16
Spacing=3

# Unselected candidate color
# Text
NormalColor=#F6F3E8
# Selected candidate color
# Base
HighlightCandidateColor=#222222
# Input character color
# Green
HighlightColor=#CAE682
# Input character background color
# Surface 0
HighlightBackgroundColor=#444444

[InputPanel/TextMargin]
Left=18
Right=18
Top=8
Bottom=8

[InputPanel/Background]
# Surface 0
Color=#222222

# Uncomment this to switch to rounded-corner
# Image=panel.svg

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
# Green
Color=#CAE682

# Uncomment this to switch to rounded-corner
# Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=18
Right=18
Top=8
Bottom=8

[Menu]
Font=Sans 16
# Text
NormalColor=#F6F3E8
Spacing=3

[Menu/Background]
# Surface 0
Color=#222222

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
# Pink
Color=#CAE682

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
# Base
Color=#222222

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
